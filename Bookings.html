<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bean & Brew</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <nav>
            <div class="navbar">
            <img src="images/coffeeBeanLogo.png" alt="Bean and Brew logo" style="width:20px; height:20px;">
            <a href="Home.html">Home</a>
            <a href="About.html">About</a>
            <a href="Menu.html">Menu</a>
            <a href="Events.html">Events</a>
            <a href="Promo.html">Promotions</a>
            </div>
        </nav>

        <div class="container"> 
            <img src="images/orangeBanner.jpg" alt="Orange fabric" width="100%" height = "200px">
            <div class="centered"><header>Bookings</header></div>
        </div>

        <main>
            <h2>Booking Form</h2>

            <form id = "bookingForm">
            <p>Please fill out the form below to create your booking. 
                Any problems please contact us through our telephone number or email.
            </p>

            <label  for="name"> Full name: </label>
            <input type="text" id="name"/>
            <div id="nameError" class="error"></div>

            <label  for="email"> Email: </label>
            <input type="text" id="email"/>
            <div id="emailError" class="error"></div>

            <label for="guest"> Number of Guests: </label>
            <input type="number" id="guest"/>
            <div id="guestError" class="error"></div>

            <label for="date"> Date: </label>
            <input type="date" id="date"/>
            <div id="dateError" class="error"></div>

            <label for="time"> Time: </label>
            <input type="time" id="time"/>
            <div id="timeError" class="error"></div>

            <button type="submit">Submit</button>
            <div id="forMessage"></div>
            </form>

        </main>

        
        <footer>
           <hr style="width:100%; height:1px; margin-top: 40px; background-color:black;">
            <section>
            <h3>Footer</h3>

                <div class="flex-container">
                    <div class="flex-item">
                        Location: <b>82 Coffee Lane PA3 4TF</b>
                    </div>

                    <div class="flex-item">
                        Telephone: <b>07536 180322</b>
                    </div>

                    <div class="flex-item">
                        Email: <b>beanandbrew @gmail.com</b>
                    </div>
                </div>

            </section>
            
            <p>&#169; Bean & Brew</p> 
        </footer>      


        <script>

        const form = document.getElementById('bookingForm');
        const message = document.getElementById('forMessage');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            let valid = true;

            document.querySelectorAll('.error').forEach(el => el.textContent = '');
            message.textContent='';

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const guest = document.getElementById('guest').value.trim();
            const date = document.getElementById('date').value.trim();
            const time = document.getElementById('time').value.trim();

            if(!name){
                document.getElementById('nameError').textContent = 'Name is required';
                valid = false;
            }

            if(!email){
                document.getElementById('emailError').textContent = 'Email is required';
                valid = false;
            }

            if(!guest || guest <= 0){
                document.getElementById('guestError').textContent = 'Enter a valid number of guests';
                valid = false;
            }   
            
            if(!date){
                document.getElementById('dateError').textContent = 'Date is required';
                valid = false;
            }

            if(!time){
                document.getElementById('timeError').textContent = 'Time is required';
                valid = false;
            }

            if(valid){
                message.textContent = 'Successfully booked!';
                message.className = 'error'
                form.reset();
            } else {
                message.textContent = 'Please fix the errors above';
                message.className = 'error';
            }
        });

    </script>

     
    </body>
</html>
